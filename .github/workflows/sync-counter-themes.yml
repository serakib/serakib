name: Sync Moe Counter Themes

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-moe-counter-themes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate all themes from the same live count
        run: node .github/scripts/sync-counter-themes.mjs

      - name: Commit updated counter images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/counter-themes
          if git diff --cached --quiet; then
            echo "Counter images are already up to date."
            exit 0
          fi
          git commit -m "Sync visitor counter theme previews"
          git push
