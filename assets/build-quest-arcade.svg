<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Gokul's build quest</title>
  <desc id="desc">A colorful animated pixel-art game where a player moves through the levels Learn, Test, and Ship.</desc>

  <defs>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="7" fill="#171135"/>
      <rect y="7" width="8" height="1" fill="#0d0921"/>
    </pattern>
    <path id="playerPath" d="M 92 247 H 330 L 410 217 H 690 L 790 187 H 1080"/>
  </defs>

  <rect width="1200" height="320" fill="#0d0921"/>
  <rect x="8" y="8" width="1184" height="304" fill="#ffd84d"/>
  <rect x="14" y="14" width="1172" height="292" fill="#ff4f8b"/>
  <rect x="20" y="20" width="1160" height="280" fill="url(#scanlines)"/>

  <!-- Pixel stars -->
  <g fill="#7466a8">
    <rect x="76" y="80" width="6" height="6"/>
    <rect x="142" y="112" width="4" height="4"/>
    <rect x="365" y="76" width="5" height="5"/>
    <rect x="445" y="102" width="4" height="4"/>
    <rect x="703" y="72" width="6" height="6"/>
    <rect x="807" y="96" width="4" height="4"/>
    <rect x="1060" y="74" width="5" height="5"/>
    <rect x="1132" y="118" width="4" height="4"/>
  </g>

  <!-- HUD -->
  <g font-family="monospace" font-weight="700">
    <text x="48" y="54" fill="#4de1ff" font-size="15">PLAYER 1</text>
    <text x="135" y="54" fill="#ffffff" font-size="15">PACO</text>
    <text x="500" y="54" fill="#ffffff" font-size="15">SCORE</text>
    <text x="560" y="54" fill="#ffd84d" font-size="15">000600</text>
    <text x="958" y="54" fill="#ffffff" font-size="15">WORLD</text>
    <text x="1016" y="54" fill="#8aff80" font-size="15">ML-01</text>
  </g>

  <!-- Lives -->
  <g fill="#ff4f8b">
    <rect x="226" y="42" width="8" height="8"/>
    <rect x="242" y="42" width="8" height="8"/>
    <rect x="258" y="42" width="8" height="8"/>
  </g>

  <!-- Level labels -->
  <g font-family="monospace" text-anchor="middle" font-weight="700">
    <text x="215" y="113" fill="#4de1ff" font-size="12">LEVEL 01</text>
    <text x="215" y="139" fill="#ffffff" font-size="25">LEARN</text>
    <text x="215" y="159" fill="#9387bd" font-size="10">COLLECT KNOWLEDGE</text>

    <text x="570" y="90" fill="#ff72b0" font-size="12">LEVEL 02</text>
    <text x="570" y="116" fill="#ffffff" font-size="25">TEST</text>
    <text x="570" y="136" fill="#9387bd" font-size="10">FACE THE EVIDENCE</text>

    <text x="950" y="68" fill="#ffd84d" font-size="12">LEVEL 03</text>
    <text x="950" y="94" fill="#ffffff" font-size="25">SHIP</text>
    <text x="950" y="114" fill="#9387bd" font-size="10">RELEASE THE BUILD</text>
  </g>

  <!-- Book power-up -->
  <g transform="translate(195 176)">
    <rect x="0" y="0" width="18" height="24" fill="#4de1ff"/>
    <rect x="20" y="0" width="18" height="24" fill="#4de1ff"/>
    <rect x="16" y="4" width="6" height="24" fill="#ffffff"/>
    <rect x="4" y="5" width="9" height="3" fill="#171135"/>
    <rect x="25" y="5" width="9" height="3" fill="#171135"/>
    <animateTransform attributeName="transform" type="translate" values="195 176;195 170;195 176" dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- Flask power-up -->
  <g transform="translate(552 149)">
    <rect x="12" y="0" width="14" height="14" fill="#ffffff"/>
    <rect x="8" y="12" width="22" height="7" fill="#ffffff"/>
    <rect x="3" y="19" width="32" height="23" fill="#ff72b0"/>
    <rect x="8" y="15" width="22" height="7" fill="#171135"/>
    <rect x="8" y="27" width="22" height="5" fill="#ffffff" opacity="0.75"/>
    <animateTransform attributeName="transform" type="translate" values="552 149;552 143;552 149" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
  </g>

  <!-- Rocket power-up -->
  <g transform="translate(934 122)">
    <rect x="12" y="0" width="18" height="8" fill="#ffffff"/>
    <rect x="6" y="8" width="30" height="30" fill="#ffd84d"/>
    <rect x="13" y="13" width="16" height="12" fill="#4de1ff"/>
    <rect x="0" y="30" width="12" height="14" fill="#ff4f8b"/>
    <rect x="30" y="30" width="12" height="14" fill="#ff4f8b"/>
    <rect x="13" y="38" width="7" height="12" fill="#ff7b42">
      <animate attributeName="height" values="12;20;12" dur="0.45s" repeatCount="indefinite"/>
    </rect>
    <rect x="22" y="38" width="7" height="18" fill="#ffd84d">
      <animate attributeName="height" values="18;10;18" dur="0.45s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Platforms -->
  <g>
    <rect x="56" y="248" width="302" height="12" fill="#4de1ff"/>
    <rect x="56" y="260" width="302" height="9" fill="#207da0"/>
    <rect x="405" y="218" width="334" height="12" fill="#ff72b0"/>
    <rect x="405" y="230" width="334" height="9" fill="#9e376b"/>
    <rect x="785" y="188" width="350" height="12" fill="#ffd84d"/>
    <rect x="785" y="200" width="350" height="9" fill="#a47d18"/>
  </g>

  <!-- Coins -->
  <g fill="#ffd84d">
    <rect x="326" y="222" width="10" height="16">
      <animate attributeName="width" values="10;3;10" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="710" y="192" width="10" height="16">
      <animate attributeName="width" values="10;3;10" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="1085" y="162" width="10" height="16">
      <animate attributeName="width" values="10;3;10" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Player -->
  <g>
    <rect x="-8" y="-28" width="16" height="12" fill="#ffd2a6"/>
    <rect x="-12" y="-16" width="24" height="15" fill="#8aff80"/>
    <rect x="-12" y="-1" width="8" height="8" fill="#4de1ff"/>
    <rect x="4" y="-1" width="8" height="8" fill="#4de1ff"/>
    <rect x="-12" y="-33" width="20" height="6" fill="#ff4f8b"/>
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#playerPath"/>
    </animateMotion>
  </g>

  <!-- Bottom game message -->
  <rect x="44" y="282" width="1112" height="3" fill="#352a63"/>
  <text x="600" y="296" text-anchor="middle" fill="#8aff80" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2">LEARN  &gt;  TEST  &gt;  SHIP  &gt;  REPEAT</text>
</svg>
