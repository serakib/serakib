<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Gokul's animated current status</title>
  <desc id="desc">A purple and gold retro arcade status panel showing learning, building, and deploying as active.</desc>

  <defs>
    <pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="5" fill="#24123f"/>
      <rect y="5" width="6" height="1" fill="#160a29"/>
    </pattern>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Stepped arcade cabinet -->
  <rect width="520" height="300" fill="#0d0717"/>
  <rect x="18" y="8" width="484" height="284" fill="#f5c451"/>
  <rect x="8" y="18" width="504" height="264" fill="#f5c451"/>
  <rect x="24" y="14" width="472" height="272" fill="#5b2b82"/>
  <rect x="14" y="24" width="492" height="252" fill="#5b2b82"/>
  <rect x="26" y="26" width="468" height="248" fill="url(#scanlines)"/>

  <!-- Animated gold circuit around the playfield -->
  <rect x="32" y="32" width="456" height="236" fill="none" stroke="#f5c451" stroke-width="2" stroke-dasharray="28 12">
    <animate attributeName="stroke-dashoffset" values="0;-80" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner pixels -->
  <g fill="#fff0a6">
    <rect x="30" y="30" width="12" height="12"/>
    <rect x="478" y="30" width="12" height="12"/>
    <rect x="30" y="258" width="12" height="12"/>
    <rect x="478" y="258" width="12" height="12"/>
  </g>

  <!-- Header -->
  <g font-family="monospace" font-weight="700" text-anchor="middle">
    <text x="260" y="68" fill="#f5c451" font-size="24" letter-spacing="3" filter="url(#goldGlow)">CURRENT STATUS</text>
    <text x="260" y="87" fill="#b995d4" font-size="9" letter-spacing="4">PLAYER PROFILE // ONLINE</text>
  </g>

  <rect x="72" y="99" width="376" height="3" fill="#5b2b82"/>
  <rect x="170" y="99" width="180" height="3" fill="#f5c451">
    <animate attributeName="x" values="72;268;72" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="width" values="70;180;70" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Selection cursor -->
  <g fill="#f5c451">
    <rect x="66" y="127" width="8" height="8"/>
    <rect x="74" y="135" width="8" height="8"/>
    <rect x="66" y="143" width="8" height="8"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 52;0 104;0 0" keyTimes="0;0.3;0.6;1" dur="4.8s" repeatCount="indefinite"/>
  </g>

  <!-- Status rows -->
  <g font-family="monospace" font-weight="700" font-size="18">
    <text x="100" y="146" fill="#ffffff" letter-spacing="2">LEARNING</text>
    <text x="100" y="198" fill="#ffffff" letter-spacing="2">BUILDING</text>
    <text x="100" y="250" fill="#ffffff" letter-spacing="2">DEPLOYING</text>

    <g text-anchor="middle" font-size="13" letter-spacing="1">
      <rect x="319" y="122" width="118" height="32" fill="#3b1e59" stroke="#f5c451" stroke-width="2"/>
      <text x="378" y="143" fill="#f5c451">[ ACTIVE ]</text>

      <rect x="319" y="174" width="118" height="32" fill="#3b1e59" stroke="#f5c451" stroke-width="2"/>
      <text x="378" y="195" fill="#f5c451">[ ACTIVE ]</text>

      <rect x="319" y="226" width="118" height="32" fill="#3b1e59" stroke="#f5c451" stroke-width="2"/>
      <text x="378" y="247" fill="#f5c451">[ ACTIVE ]</text>
    </g>
  </g>

  <!-- Blinking state pixels -->
  <g fill="#f5c451" filter="url(#goldGlow)">
    <rect x="290" y="133" width="10" height="10">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="290" y="185" width="10" height="10">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="290" y="237" width="10" height="10" fill="#f5c451" filter="url(#goldGlow)">
    <animate attributeName="width" values="10;4;10" dur="1.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Tiny arcade sparkles -->
  <g fill="#f5c451">
    <rect x="52" y="67" width="4" height="4">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="464" y="81" width="4" height="4">
      <animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="454" y="215" width="5" height="5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
